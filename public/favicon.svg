<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976d2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565c0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Wallet body -->
  <rect x="8" y="18" width="48" height="36" rx="4" fill="url(#grad1)" stroke="#0d47a1" stroke-width="2"/>
  
  <!-- Wallet clasp -->
  <rect x="24" y="18" width="16" height="8" rx="2" fill="#0d47a1"/>
  
  <!-- Money bills -->
  <rect x="14" y="32" width="40" height="6" rx="1" fill="#ffffff" opacity="0.9"/>
  <rect x="14" y="42" width="36" height="6" rx="1" fill="#ffffff" opacity="0.8"/>
  <rect x="14" y="52" width="32" height="6" rx="1" fill="#ffffff" opacity="0.7"/>
  
  <!-- Currency symbol -->
  <text x="32" y="38" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2" text-anchor="middle">₽</text>
</svg>
