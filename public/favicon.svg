<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976d2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565c0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e3f2fd;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#0d47a1" stroke-width="2"/>
  
  <!-- Large ruble symbol -->
  <text x="32" y="45" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="url(#symbolGrad)" text-anchor="middle" style="font-family: 'Arial Black', Arial, sans-serif;">₽</text>
  
  <!-- Decorative lines (optional - can remove if too busy) -->
  <line x1="20" y1="20" x2="24" y2="20" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="40" y1="20" x2="44" y2="20" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
</svg>
